[package]
name = "herder-tower"
version = "0.1.0"
edition = "2024"
description = "A voice control tower for Herdr: talk to every Claude Code and Codex session on every machine, and hear them answer."
license = "MIT"

[[bin]]
name = "tower"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
core-foundation = "0.10"
core-graphics = "0.25"
cpal = "0.18"
dirs = "7.0.0"
futures = "0.3"
global-hotkey = "0.9"
# GPUI Kit (gpui-kit.com): GPUI plus its styled components. It builds GPUI with
# runtime shaders, so building needs no Metal Toolchain.
gpui-kit = "0.9.0"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
loqui = "0.4"
notify = "8"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The same versions GPUI uses: the orb reaches its NSWindow for what GPUI has no API for.
cocoa = "=0.26.0"
# The orb draws its liquid shader with Metal (the same version GPUI uses).
core-graphics-types = "0.1.3"
metal = "0.29"
objc = "0.2"
raw-window-handle = "0.6"

[profile.release]
lto = "thin"
codegen-units = 4
